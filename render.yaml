services:
  - type: web
    name: kroger-mcp
    runtime: python
    plan: free

    buildCommand: pip install .
    startCommand: python remote_server.py

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11

      - key: KROGER_CLIENT_ID
        sync: false

      - key: KROGER_CLIENT_SECRET
        sync: false

      - key: KROGER_REDIRECT_URI
        sync: false

      - key: KROGER_USER_ZIP_CODE
        value: "43123"

      # Hoover Road Kroger, Grove City, OH. This deployment-level value is
      # authoritative for product/location operations so restarts do not lose
      # the selected store when Render's ephemeral filesystem is cleared.
      - key: KROGER_PREFERRED_LOCATION_ID
        value: "01600842"

      - key: KROGER_USER_REFRESH_TOKEN
        sync: false

      # Recommended on Render's free tier. This API key lets the running service
      # update its KROGER_USER_REFRESH_TOKEN setting when Kroger rotates it.
      # The service ID is resolved from Render's documented RENDER_SERVICE_NAME;
      # RENDER_SERVICE_ID may still be set explicitly as an override.
      # Keep the API key in Render's secret environment configuration, never Git.
      - key: RENDER_API_KEY
        sync: false

      - key: KROGER_TOKEN_DIR
        value: "/tmp/kroger-mcp"
