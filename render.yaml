services:
  - type: web
    name: kroger-mcp
    runtime: python
    plan: free

    buildCommand: pip install .
    startCommand: python remote_server.py

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11

      - key: KROGER_CLIENT_ID
        sync: false

      - key: KROGER_CLIENT_SECRET
        sync: false

      - key: KROGER_REDIRECT_URI
        sync: false

      - key: KROGER_USER_ZIP_CODE
        value: "43123"

      # Hoover Road Kroger, Grove City, OH. This deployment-level value is
      # authoritative for product/location operations so restarts do not lose
      # the selected store when Render's ephemeral filesystem is cleared.
      - key: KROGER_PREFERRED_LOCATION_ID
        value: "01600842"

      - key: KROGER_USER_REFRESH_TOKEN
        sync: false

      # Upstash stores the complete OAuth token payload across free-tier spin-downs
      # and coordinates refresh-token rotation between overlapping instances.
      # Copy both values from the Upstash database's REST API section.
      - key: UPSTASH_REDIS_REST_URL
        sync: false

      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      - key: KROGER_TOKEN_DIR
        value: "/tmp/kroger-mcp"
